[package]
name = "switchrecomp-gui"
version = "1.0.0"
edition = "2024"
description = "Desktop front end for the SwitchRecomp static recompiler"
license = "Apache-2.0"
publish = false

[[bin]]
name = "SwitchRecomp"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the single-file build unpacks its embedded toolchain (see build.rs)
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
tar = { version = "0.4", default-features = false }
winresource = "0.1"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
