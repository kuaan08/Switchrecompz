# Builds SwitchRecomp for Windows and publishes it on the Releases page:
#   - SwitchRecomp.exe: one file with the GUI, the recompiler, the runtimes,
#     Python, TCC and GCC inside
# Every push to main replaces the "dev" pre-release (Development build).
# Pushing a tag like v1.2.0, or running this workflow by hand with a version,
# publishes a versioned release with generated notes. Pull requests only build
# and upload artifacts. With a DISCORD_WEBHOOK secret, versioned releases are
# also announced on Discord.
#
# Windows builds on GitHub's Windows runners by default. To use your own machine,
# register a Windows x64 self-hosted runner (it needs PowerShell 7 and rustup),
# then either pick it when starting the workflow by hand, or set the repository
# variable SWR_RUNNER to its labels: self-hosted, or a JSON list like
# ["self-hosted", "windows"].

name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version, like v1.2.0 (empty: build only)'
        required: false
        default: ''
      runner:
        description: 'Windows runner: windows-latest, self-hosted, or a JSON list of labels'
        required: false
        default: windows-latest

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      kind: ${{ steps.pick.outputs.kind }}
    steps:
      - id: pick
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:INPUT_VERSION) { $v = $env:INPUT_VERSION.Trim(); $kind = 'stable' }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME; $kind = 'stable' }
          else { $v = 'dev-' + $env:GITHUB_SHA.Substring(0, 7); $kind = 'dev' }
          if ($kind -eq 'stable' -and $v -notmatch '^v\d+(\.\d+)*(-[0-9A-Za-z.-]+)?$') {
            throw "The version '$v' should look like v1.2.0"
          }
          Write-Host "Building $v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT

  windows:
    name: Windows exe
    needs: version
    runs-on: >-
      ${{ startsWith(inputs.runner || vars.SWR_RUNNER, '[')
          && fromJSON(inputs.runner || vars.SWR_RUNNER)
          || inputs.runner || vars.SWR_RUNNER || 'windows-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
      SWR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore tool downloads
        id: tool_downloads
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache
          key: tools-${{ hashFiles('ci/toolchains.ps1', 'ci/fetch_angle.py') }}

      - name: Get Python, TCC and GCC
        run: ./ci/toolchains.ps1

      - name: Get pinned ANGLE Vulkan and DirectX libraries
        run: python ci/fetch_angle.py

      - name: Save verified tool downloads
        if: steps.tool_downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache
          key: ${{ steps.tool_downloads.outputs.cache-primary-key }}

      - name: Restore compiled Windows runtimes and hactool
        id: native_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            bin
            tools/hactool
          # Exact matches only: never reuse binaries built from different sources.
          key: native-win-x64-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('runtime/**', 'switchrecomp.py', 'ci/build_hactool.py', 'ci/toolchains.ps1', '.github/workflows/build.yml') }}

      - name: Check out pinned hactool source
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: SciresM/hactool
          ref: 1d64a83450e025622f3468c28fc4164dad2c5ef6
          path: .ci-build/hactool
          persist-credentials: false

      - name: Build and test bundled hactool
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: ./python/python.exe ci/build_hactool.py --source .ci-build/hactool

      - name: Build the runtimes with GCC
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: |
          ./python/python.exe -X utf8 switchrecomp.py --build-runtime --cc w64devkit/bin/gcc.exe
          if ($LASTEXITCODE) { exit 1 }
          ./python/python.exe -X utf8 switchrecomp.py --build-runtime --backend headless --cc w64devkit/bin/gcc.exe
          if ($LASTEXITCODE) { exit 1 }

      - name: Check required native files
        run: |
          $required = @('bin/runtime_win64_win32.exe', 'bin/runtime_win64_headless.exe',
                        'tools/hactool/hactool.exe', 'tools/hactool/LICENSE-hactool.txt',
                        'tools/hactool/LICENSE-mbedtls.txt', 'tools/hactool/apache-2.0.txt')
          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing native build output: $file" }
          }

      - name: Test Vulkan and DirectX graphics paths
        run: |
          $env:PATH = (Resolve-Path w64devkit/bin).Path + ';' + $env:PATH
          ./w64devkit/bin/gcc.exe -O2 -I runtime ci/graphics_probe.c runtime/angle_win32.c runtime/gl_load.c runtime/shader.c -o graphics-probe.exe
          if ($LASTEXITCODE) { exit 1 }
          $env:SWR_ANGLE_DIR = (Resolve-Path tools/angle).Path
          ./graphics-probe.exe d3d11-warp
          if ($LASTEXITCODE) { exit 1 }
          ./graphics-probe.exe vulkan-software
          if ($LASTEXITCODE) { exit 1 }

      - name: Test package import
        run: python -m unittest discover -s tests -v

      - name: Smoke test the recompiler
        run: ./ci/smoke-test.ps1 -Root .

      - name: Save compiled Windows runtimes and hactool
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            bin
            tools/hactool
          key: ${{ steps.native_cache.outputs.cache-primary-key }}

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
          cache-on-failure: true
          cache-workspace-crates: true
          # Refresh the workspace snapshot when GUI sources change, while the
          # action can still restore matching dependency caches as a fallback.
          key: windows-workspace-v1-${{ hashFiles('gui/src/**', 'gui/build.rs', 'gui/Cargo.toml', 'gui/Cargo.lock') }}

      - name: Lint and test the GUI
        working-directory: gui
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit 1 }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { exit 1 }
          cargo test --locked
          if ($LASTEXITCODE) { exit 1 }

      - name: Stage what the exe carries
        run: ./ci/stage-payload.ps1 -Out dist/payload

      - name: Build the single-file exe
        working-directory: gui
        env:
          SWR_PAYLOAD_DIR: ${{ github.workspace }}/dist/payload
        run: cargo build --release --locked

      - name: Smoke test the single-file exe
        run: |
          $dir = Join-Path $env:RUNNER_TEMP unpacked
          $p = Start-Process gui/target/release/SwitchRecomp.exe -ArgumentList '--unpack', $dir -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--unpack exited with code $($p.ExitCode)" }
          ./ci/smoke-test.ps1 -Root $dir

      - name: Collect
        run: |
          New-Item -ItemType Directory -Force dist/out | Out-Null
          Copy-Item gui/target/release/SwitchRecomp.exe dist/out/
          $hash = (Get-FileHash dist/out/SwitchRecomp.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SwitchRecomp.exe" | Set-Content dist/out/SwitchRecomp.exe.sha256
          Get-ChildItem dist/out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: SwitchRecomp-windows
          path: dist/out/*
          if-no-files-found: error

  android:
    name: Android APK exporter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install SDK components
        run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build a synthetic arm64 APK
        run: |
          python3 ci/make_test_nro.py "$RUNNER_TEMP/android-test.nro"
          python3 android_build.py "$RUNNER_TEMP/android-test.nro" -o AndroidSmoke --outdir "$RUNNER_TEMP/android-out" --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/27.2.12479018" --jobs 4
          python3 ci/verify_android.py "$RUNNER_TEMP/android-out/AndroidSmoke.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: Android-synthetic-smoke
          path: ${{ runner.temp }}/android-out/AndroidSmoke.apk
          retention-days: 7

  publish:
    name: Publish on Releases
    needs: [version, windows, android]
    if: >-
      (github.event_name == 'push' && ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ci

      - uses: actions/download-artifact@v8
        with:
          name: SwitchRecomp-windows
          merge-multiple: true
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ needs.version.outputs.kind }}
          VERSION: ${{ needs.version.outputs.version }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash ci/publish-release.sh
