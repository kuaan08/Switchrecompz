# Builds SwitchRecomp for Windows and Linux and publishes both on the Releases page:
#   - SwitchRecomp.exe: one file with the GUI, the recompiler, the runtimes,
#     Python, TCC and GCC inside
#   - SwitchRecomp-linux-x86_64.tar.gz: one program with the GUI, the recompiler,
#     the runtimes and TCC inside; Python and GCC come from the system
# Every push to master replaces the "dev" pre-release (Development build).
# Pushing a tag like v1.2.0, or running this workflow by hand with a version,
# publishes a versioned release with generated notes. Pull requests only build
# and upload artifacts. With a DISCORD_WEBHOOK secret, versioned releases are
# also announced on Discord.
#
# Windows builds on GitHub's Windows runners by default. To use your own machine,
# register a Windows x64 self-hosted runner (it needs PowerShell 7 and rustup),
# then either pick it when starting the workflow by hand, or set the repository
# variable SWR_RUNNER to its labels: self-hosted, or a JSON list like
# ["self-hosted", "windows"]. Linux builds on Ubuntu 22.04, so the binaries
# also run on distributions with an older C library (glibc 2.35).

name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version, like v1.2.0 (empty: build only)'
        required: false
        default: ''
      runner:
        description: 'Windows runner: windows-latest, self-hosted, or a JSON list of labels'
        required: false
        default: windows-latest

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      kind: ${{ steps.pick.outputs.kind }}
    steps:
      - id: pick
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:INPUT_VERSION) { $v = $env:INPUT_VERSION.Trim(); $kind = 'stable' }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME; $kind = 'stable' }
          else { $v = 'dev-' + $env:GITHUB_SHA.Substring(0, 7); $kind = 'dev' }
          if ($kind -eq 'stable' -and $v -notmatch '^v\d+(\.\d+)*(-[0-9A-Za-z.-]+)?$') {
            throw "The version '$v' should look like v1.2.0"
          }
          Write-Host "Building $v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT

  windows:
    name: Windows exe
    needs: version
    runs-on: >-
      ${{ startsWith(inputs.runner || vars.SWR_RUNNER, '[')
          && fromJSON(inputs.runner || vars.SWR_RUNNER)
          || inputs.runner || vars.SWR_RUNNER || 'windows-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
      SWR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache tool downloads
        uses: actions/cache@v6
        with:
          path: .ci-cache
          key: tools-${{ hashFiles('ci/toolchains.ps1') }}

      - name: Get Python, TCC and GCC
        run: ./ci/toolchains.ps1

      - name: Build the runtimes with GCC
        run: |
          ./python/python.exe -X utf8 switchrecomp.py --build-runtime --cc w64devkit/bin/gcc.exe
          if ($LASTEXITCODE) { exit 1 }
          ./python/python.exe -X utf8 switchrecomp.py --build-runtime --backend headless --cc w64devkit/bin/gcc.exe
          if ($LASTEXITCODE) { exit 1 }

      - name: Test package import
        run: python -m unittest discover -s tests -v

      - name: Smoke test the recompiler
        run: ./ci/smoke-test.ps1 -Root .

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Lint and test the GUI
        working-directory: gui
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit 1 }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { exit 1 }
          cargo test --locked
          if ($LASTEXITCODE) { exit 1 }

      - name: Stage what the exe carries
        run: ./ci/stage-payload.ps1 -Out dist/payload

      - name: Build the single-file exe
        working-directory: gui
        env:
          SWR_PAYLOAD_DIR: ${{ github.workspace }}/dist/payload
        run: cargo build --release --locked

      - name: Smoke test the single-file exe
        run: |
          $dir = Join-Path $env:RUNNER_TEMP unpacked
          $p = Start-Process gui/target/release/SwitchRecomp.exe -ArgumentList '--unpack', $dir -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--unpack exited with code $($p.ExitCode)" }
          ./ci/smoke-test.ps1 -Root $dir

      - name: Collect
        run: |
          New-Item -ItemType Directory -Force dist/out | Out-Null
          Copy-Item gui/target/release/SwitchRecomp.exe dist/out/
          $hash = (Get-FileHash dist/out/SwitchRecomp.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SwitchRecomp.exe" | Set-Content dist/out/SwitchRecomp.exe.sha256
          Get-ChildItem dist/out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: SwitchRecomp-windows
          path: dist/out/*
          if-no-files-found: error

  linux:
    name: Linux app
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
      SWR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm libx11-dev libgl-dev

      - name: Cache tool downloads
        uses: actions/cache@v6
        with:
          path: .ci-cache
          key: tools-linux-${{ hashFiles('ci/toolchains.sh') }}

      - name: Build TCC and OpenH264
        run: ./ci/toolchains.sh

      - name: Build the runtimes with GCC
        run: |
          python3 -X utf8 switchrecomp.py --build-runtime --backend x11
          python3 -X utf8 switchrecomp.py --build-runtime --backend headless

      - name: Test package import
        run: python3 -m unittest discover -s tests -v

      - name: Smoke test the recompiler
        shell: pwsh
        run: ./ci/smoke-test.ps1 -Root .

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Lint and test the GUI
        working-directory: gui
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Stage what the app carries
        shell: pwsh
        run: ./ci/stage-payload.ps1 -Out dist/payload

      - name: Build the single-file app
        working-directory: gui
        env:
          SWR_PAYLOAD_DIR: ${{ github.workspace }}/dist/payload
        run: cargo build --release --locked

      - name: Smoke test the single-file app
        run: |
          gui/target/release/SwitchRecomp --unpack "$RUNNER_TEMP/unpacked"
          pwsh ./ci/smoke-test.ps1 -Root "$RUNNER_TEMP/unpacked"

      - name: Collect
        run: |
          mkdir -p dist/out
          tar -czf dist/out/SwitchRecomp-linux-x86_64.tar.gz -C gui/target/release SwitchRecomp
          (cd dist/out && sha256sum SwitchRecomp-linux-x86_64.tar.gz > SwitchRecomp-linux-x86_64.tar.gz.sha256)
          ls -l dist/out

      - uses: actions/upload-artifact@v7
        with:
          name: SwitchRecomp-linux
          path: dist/out/*
          if-no-files-found: error

  publish:
    name: Publish on Releases
    needs: [version, windows, linux]
    if: >-
      (github.event_name == 'push' && ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ci

      - uses: actions/download-artifact@v8
        with:
          pattern: SwitchRecomp-*
          merge-multiple: true
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ needs.version.outputs.kind }}
          VERSION: ${{ needs.version.outputs.version }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash ci/publish-release.sh
